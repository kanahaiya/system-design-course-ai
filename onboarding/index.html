<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Set your interview level and get a focused MAANG system design learning path in under one minute.">
  <title>Onboarding — MAANG System Design</title>
  <link rel="canonical" href="https://dataformatterpro.com/system-design/onboarding/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>
  <main id="main" class="page-wrapper">
    <section class="section">
      <div class="container">
        <div class="section__header">
          <div class="section__label">Onboarding</div>
          <h1 class="section__title">Build your interview path</h1>
          <p class="section__desc">This helps us recommend where to start first.</p>
        </div>

        <article class="card" style="max-width:640px;margin:0 auto">
          <form id="js-onboarding-form" class="account-form">
            <label for="js-onboarding-level">Current level</label>
            <select id="js-onboarding-level" name="level" required>
              <option value="">Select level</option>
              <option value="beginner">Beginner</option>
              <option value="intermediate">Intermediate</option>
              <option value="advanced">Advanced</option>
            </select>
            <label for="js-onboarding-target">Target role</label>
            <select id="js-onboarding-target" name="target" required>
              <option value="">Select target</option>
              <option value="sde2">SDE 2</option>
              <option value="senior">Senior</option>
              <option value="staff">Staff+</option>
            </select>
            <button type="submit" class="btn btn--primary">Save and continue</button>
          </form>
          <p id="js-onboarding-status" class="account-status" aria-live="polite"></p>
        </article>
      </div>
    </section>
  </main>

  <script src="../assets/js/shared.js" type="module"></script>
</body>
</html>
