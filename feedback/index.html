<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Share product feedback or report course bugs. Help improve MAANG System Design with your suggestions and issue reports.">
  <title>Feedback & Bug Report — MAANG System Design</title>
  <link rel="canonical" href="https://dataformatterpro.com/system-design/feedback/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>
  <main id="main" class="page-wrapper">
    <section class="section">
      <div class="container">
        <div class="section__header">
          <div class="section__label">Feedback</div>
          <h1 class="section__title">Feedback & Bug Report</h1>
          <p class="section__desc">Tell us what is useful and what is broken.</p>
        </div>
        <article class="card">
          <form id="js-feedback-form" class="account-form">
            <label for="js-feedback-type">Type</label>
            <select id="js-feedback-type" name="type" required>
              <option value="">Select type</option>
              <option value="feedback">General feedback</option>
              <option value="bug">Bug report</option>
            </select>
            <label for="js-feedback-email">Email</label>
            <input id="js-feedback-email" name="email" type="email" required placeholder="you@example.com">
            <label for="js-feedback-message">Message</label>
            <textarea id="js-feedback-message" name="message" required rows="6" style="background:var(--color-bg-elevated);border:1px solid var(--color-border);border-radius:var(--radius-md);color:var(--color-text-primary);padding:var(--space-2) var(--space-3);font-size:var(--text-sm);font-family:inherit"></textarea>
            <label for="js-company" class="visually-hidden">Company</label>
            <input id="js-company" name="company" type="text" autocomplete="off" tabindex="-1" class="visually-hidden" aria-hidden="true">
            <button type="submit" class="btn btn--primary">Submit</button>
          </form>
          <p id="js-feedback-status" class="account-status" aria-live="polite"></p>
        </article>
      </div>
    </section>
  </main>
  <script src="../assets/js/launch-config.js"></script>
  <script src="../assets/js/shared.js" type="module"></script>
</body>
</html>
